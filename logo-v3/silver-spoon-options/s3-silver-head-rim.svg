<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>머먹 - 실버 림 스푼 S3 (세이지 손잡이 + 실버 림 헤드)</title>
  <rect width="256" height="256" rx="56" fill="#EFE6D4"/>
  <g transform="translate(18, 14) scale(0.86)">
    <!-- Spoon: Sage handle + Silver rimmed head -->
    <g transform="rotate(-30 168 76)">
      <!-- Handle in Sage -->
      <rect x="160" y="20" width="16" height="66" rx="8" fill="#D9D8B8"/>
      
      <!-- Head: Outer Silver Rim -->
      <ellipse cx="168" cy="90" rx="23" ry="27" fill="#BFC7CE"/>
      <!-- Head: Inner Sage Fill -->
      <ellipse cx="168" cy="90" rx="18.5" ry="22.5" fill="#D9D8B8"/>
      <!-- Silver inner reflection lip -->
      <ellipse cx="168" cy="90" rx="13" ry="16" fill="#E8ECEF" opacity="0.65"/>
    </g>

    
    <!-- Bowl Body in Olive -->
    <path fill-rule="evenodd" fill="#4D5B3C" d="
      M 32,118
      H 224
      C 220,192 180,214 128,214
      C 76,214 36,192 32,118
      Z

      M 86,146
      A 8,8 0 1,1 85.9,146
      Z

      M 170,146
      A 8,8 0 1,1 169.9,146
      Z

      M 106,164
      Q 128,184 150,164
      Q 128,174 106,164
      Z
    "/>

    <!-- Bowl Rim in Warm Honey Gold -->
    <rect x="24" y="106" width="208" height="18" rx="9" fill="#E5A83B"/>

    <!-- Bowl Foot Stand in Warm Honey Gold -->
    <rect x="96" y="214" width="64" height="10" rx="5" fill="#E5A83B"/>
    
  </g>
</svg>