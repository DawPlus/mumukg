<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>머먹 - 실버 림 스푼 S1 (스푼 외곽 실버 림)</title>
  <rect width="256" height="256" rx="56" fill="#EFE6D4"/>
  <g transform="translate(18, 14) scale(0.86)">
    <!-- Dipping Spoon in Sage with Silver Rim Outline -->
    <g transform="rotate(-30 168 76)">
      <!-- Silver Rim Layer (Stroke) -->
      <rect x="159" y="19" width="18" height="68" rx="9" fill="#BFC7CE"/>
      <ellipse cx="168" cy="90" rx="24" ry="28" fill="#BFC7CE"/>
      
      <!-- Inner Sage Spoon Body -->
      <rect x="161" y="21" width="14" height="64" rx="7" fill="#D9D8B8"/>
      <ellipse cx="168" cy="90" rx="20.5" ry="24.5" fill="#D9D8B8"/>
      
      <!-- Subtle Silver Sheen Highlight Curve -->
      <path d="M 160,78 a 16,20 0 0 0 14,28" fill="none" stroke="#E8ECEF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    
    <!-- Bowl Body in Olive -->
    <path fill-rule="evenodd" fill="#4D5B3C" d="
      M 32,118
      H 224
      C 220,192 180,214 128,214
      C 76,214 36,192 32,118
      Z

      M 86,146
      A 8,8 0 1,1 85.9,146
      Z

      M 170,146
      A 8,8 0 1,1 169.9,146
      Z

      M 106,164
      Q 128,184 150,164
      Q 128,174 106,164
      Z
    "/>

    <!-- Bowl Rim in Warm Honey Gold -->
    <rect x="24" y="106" width="208" height="18" rx="9" fill="#E5A83B"/>

    <!-- Bowl Foot Stand in Warm Honey Gold -->
    <rect x="96" y="214" width="64" height="10" rx="5" fill="#E5A83B"/>
    
  </g>
</svg>