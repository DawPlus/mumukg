<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <!-- Bite Mask for Concept A -->
    <mask id="bite-mask">
      <rect width="100%" height="100%" fill="white"/>
      <!-- The bite cut: 3 circular scallops for real teeth bite marks! -->
      <circle cx="446" cy="48" r="16" fill="black"/>
      <circle cx="456" cy="36" r="12" fill="black"/>
      <circle cx="436" cy="62" r="11" fill="black"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none"/>

  <g fill="#4d5b3c" fill-rule="evenodd">
    <!-- 머 -->
    <path d="M 57,51 h 34 a 7,7 0 0 1 7,7 v 38 a 7,7 0 0 1 -7,7 h -34 a 7,7 0 0 1 -7,-7 v -38 a 7,7 0 0 1 7,-7 Z M 68,65 a 4,4 0 0 0 -4,4 v 16 a 4,4 0 0 0 4,4 h 12 a 4,4 0 0 0 4,-4 v -16 a 4,4 0 0 0 -4,-4 Z M 98,77 h 14 a 4,4 0 0 1 4,4 v 6 a 4,4 0 0 1 -4,4 h -14 a 4,4 0 0 1 -4,-4 v -6 a 4,4 0 0 1 4,-4 Z M 117,35 h 4 a 5,5 0 0 1 5,5 v 100 a 5,5 0 0 1 -5,5 h -4 a 5,5 0 0 1 -5,-5 v -100 a 5,5 0 0 1 5,-5 Z"/>
    <!-- 먹 -->
    <path d="M 171,35 h 32 a 6,6 0 0 1 6,6 v 28 a 6,6 0 0 1 -6,6 h -32 a 6,6 0 0 1 -6,-6 v -28 a 6,6 0 0 1 6,-6 Z M 181,48 a 3,3 0 0 0 -3,3 v 8 a 3,3 0 0 0 3,3 h 12 a 3,3 0 0 0 3,-3 v -8 a 3,3 0 0 0 -3,-3 Z M 208,51 h 12 a 3,3 0 0 1 3,3 v 7 a 3,3 0 0 1 -3,3 h -12 a 3,3 0 0 1 -3,-3 v -7 a 3,3 0 0 1 3,-3 Z M 223,35 h 5 a 4,4 0 0 1 4,4 v 56 a 4,4 0 0 1 -4,4 h -5 a 4,4 0 0 1 -4,-4 v -56 a 4,4 0 0 1 4,-4 Z M 171,107 h 56 a 6,6 0 0 1 6,6 v 26 a 4,4 0 0 1 -13,0 v -16 h -46 a 4,4 0 0 1 0,-13 Z"/>
    
    <!-- Concept A: G with Bite Mask -->
    <g mask="url(#bite-mask)">
      <!-- G outer circle (cx=395, cy=90, R=54) and inner (R=39), sw=15 -->
      <!-- G body: arc from 40 deg CCW to crossbar -->
      <path d="
        M 432,56
        A 54,54 0 1 0 449,92
        H 395
        a 7,7 0 0 1 0,-14
        h 38
        A 39,39 0 1 1 422,66
        a 7,7 0 0 1 10,-10 Z
      "/>
    </g>
  </g>

  <!-- Cute Crumb points flying off the bite -->
  <circle cx="474" cy="38" r="4.5" fill="#4d5b3c"/>
  <circle cx="488" cy="54" r="3" fill="#d9d8b8"/>
  <circle cx="468" cy="22" r="2.5" fill="#4d5b3c"/>
</svg>